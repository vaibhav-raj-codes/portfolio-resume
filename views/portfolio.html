<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
      color: #333;
    }
    .navbar {
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .section-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      padding: 25px;
      margin-bottom: 30px;
      transition: transform 0.3s ease-in-out;
    }
    .section-card:hover {
      transform: translateY(-5px);
    }
    .profile-img {
      border: 5px solid #007bff;
      transition: transform 0.3s;
    }
    .profile-img:hover {
      transform: scale(1.05);
    }
    .skill-icon {
      margin-right: 10px;
      font-size: 1.2rem;
      color: #007bff;
    }
    footer {
      background: #212529;
      color: white;
      padding: 20px 0;
      margin-top: 40px;
      text-align: center;
    }
    footer .social-links a {
      font-size: 1.5rem;
      margin: 0 12px;
      color: white;
      transition: color 0.3s, transform 0.3s;
    }
    footer .social-links a:hover {
      color: #0d6efd;
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">My Portfolio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
      </div>
    </div>
  </nav>

  <!-- Portfolio Content -->
  <div class="container mt-5">
    <div id="portfolioContent"></div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p class="mb-2">Connect with me</p>
      <div class="social-links" id="footerSocial"></div>
      <p class="mt-3 mb-0">&copy; 2025 My Portfolio | Designed with ❤️</p>
    </div>
  </footer>

  <!-- Bootstrap JS, AOS, and Custom Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init();

    const data = JSON.parse(localStorage.getItem('portfolioData'));

    // Map skills to Font Awesome icons
    const skillIcons = {
      "java": "fa-brands fa-java",
      "html": "fa-brands fa-html5",
      "css": "fa-brands fa-css3-alt",
      "javascript": "fa-brands fa-js",
      "python": "fa-brands fa-python",
      "react": "fa-brands fa-react",
      "node": "fa-brands fa-node",
      "git": "fa-brands fa-git-alt",
      "default": "fa-solid fa-code"
    };

    if (data) {
      const container = document.getElementById('portfolioContent');
      const navLinks = document.getElementById('navLinks');
      const footerSocial = document.getElementById('footerSocial');
      let html = '';

      // Profile Section
      html += `
        <div class="text-center mb-5" data-aos="fade-down">
          ${data.imageUrl ? `<img src="${data.imageUrl}" alt="Profile" class="rounded-circle profile-img" width="180">` : ''}
          ${data.bio ? `<p class="mt-3 fs-5">${data.bio}</p>` : ''}
        </div>
      `;

      // Skills
      if (data.skills && data.skills.filter(s => s).length > 0) {
        html += `
          <div class="section-card" id="skills" data-aos="fade-right">
            <h3 class="mb-3">Skills</h3>
            <ul class="list-group">
              ${data.skills.map(s => {
                if (!s) return '';
                let key = s.toLowerCase();
                let iconClass = skillIcons[key] || skillIcons["default"];
                return `<li class="list-group-item"><i class="${iconClass} skill-icon"></i>${s}</li>`;
              }).join('')}
            </ul>
          </div>
        `;
        navLinks.innerHTML += `<li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>`;
      }

      // Education
      if (data.education && data.education.some(e => e.degree || e.institution || e.year)) {
        html += `
          <div class="section-card" id="education" data-aos="fade-left">
            <h3 class="mb-3">Education</h3>
            <ul class="list-group">
              ${data.education.map(e => (e.degree || e.institution || e.year) ? 
                `<li class="list-group-item"><b>${e.degree || ''}</b> ${e.institution ? 'at ' + e.institution : ''} ${e.year ? '(' + e.year + ')' : ''}</li>` 
                : '').join('')}
            </ul>
          </div>
        `;
        navLinks.innerHTML += `<li class="nav-item"><a class="nav-link" href="#education">Education</a></li>`;
      }

      // Experience
      if (data.experience && data.experience.some(ex => ex.role || ex.company || ex.duration || ex.description)) {
        html += `
          <div class="section-card" id="experience" data-aos="fade-right">
            <h3 class="mb-3">Experience</h3>
            <ul class="list-group">
              ${data.experience.map(ex => (ex.role || ex.company || ex.duration || ex.description) ?
                `<li class="list-group-item"><b>${ex.role || ''}</b> ${ex.company ? 'at ' + ex.company : ''} ${ex.duration ? '(' + ex.duration + ')' : ''} ${ex.description ? '- ' + ex.description : ''}</li>`
                : '').join('')}
            </ul>
          </div>
        `;
        navLinks.innerHTML += `<li class="nav-item"><a class="nav-link" href="#experience">Experience</a></li>`;
      }

      // Projects
      if (data.projects && data.projects.some(p => p.title || p.description || p.link)) {
        html += `
          <div class="section-card" id="projects" data-aos="fade-left">
            <h3 class="mb-3">Projects</h3>
            <ul class="list-group">
              ${data.projects.map(p => (p.title || p.description || p.link) ?
                `<li class="list-group-item"><b>${p.title || ''}</b>: ${p.description || ''} ${p.link ? `(<a href="${p.link}" target="_blank">View</a>)` : ''}</li>`
                : '').join('')}
            </ul>
          </div>
        `;
        navLinks.innerHTML += `<li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>`;
      }

      // Footer Social Links
      if (data.social && (data.social.linkedin || data.social.github)) {
        footerSocial.innerHTML = `
          ${data.social.linkedin ? `<a href="${data.social.linkedin}" target="_blank"><i class="fab fa-linkedin"></i></a>` : ''}
          ${data.social.github ? `<a href="${data.social.github}" target="_blank"><i class="fab fa-github"></i></a>` : ''}
        `;
      }

      container.innerHTML = html;
    }
  </script>
</body>
</html>
