<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .entry-card {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      position: relative;
    }
    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Generate Portfolio</h2>

    <form id="portfolioForm">
      <!-- Bio -->
      <div class="mb-3">
        <label for="bio" class="form-label">Bio <span class="text-danger">*</span></label>
        <textarea class="form-control" id="bio" name="bio" rows="3" required></textarea>
      </div>

      <!-- Image -->
      <div class="mb-3">
        <label for="imageUrl" class="form-label">Profile Image URL <span class="text-danger">*</span></label>
        <input type="url" class="form-control" id="imageUrl" name="imageUrl" placeholder="https://example.com/photo.jpg" required>
      </div>

      <!-- Skills -->
      <div class="mb-3">
        <label for="skills" class="form-label">Skills (comma separated)</label>
        <input type="text" class="form-control" id="skills" name="skills" placeholder="Java, HTML, CSS, JavaScript">
      </div>

      <!-- Education -->
      <div class="mb-3">
        <label class="form-label">Education <span class="text-danger">*</span></label>
        <div id="education-wrapper">
          <div class="entry-card education-entry">
            <button type="button" class="btn btn-sm btn-danger delete-btn d-none">Delete</button>
            <div class="row g-2">
              <div class="col"><input type="text" class="form-control" name="degree" placeholder="Degree" required></div>
              <div class="col"><input type="text" class="form-control" name="institution" placeholder="Institution" required></div>
              <div class="col"><input type="number" class="form-control" name="year" placeholder="Year" required></div>
            </div>
          </div>
        </div>
        <button type="button" id="addEducation" class="btn btn-sm btn-secondary mt-2">+ Add Education</button>
      </div>

      <!-- Experience (Optional) -->
      <div class="mb-3">
        <label class="form-label">Experience</label>
        <div id="experience-wrapper">
          <div class="row g-2 mb-2 experience-entry">
            <div class="col"><input type="text" class="form-control" name="role" placeholder="Role"></div>
            <div class="col"><input type="text" class="form-control" name="company" placeholder="Company"></div>
            <div class="col"><input type="text" class="form-control" name="duration" placeholder="Duration"></div>
            <div class="col"><input type="text" class="form-control" name="description" placeholder="Description"></div>
          </div>
        </div>
      </div>

      <!-- Projects -->
      <div class="mb-3">
        <label class="form-label">Projects <span class="text-danger">*</span></label>
        <div id="projects-wrapper">
          <div class="entry-card project-entry">
            <button type="button" class="btn btn-sm btn-danger delete-btn d-none">Delete</button>
            <div class="row g-2">
              <div class="col"><input type="text" class="form-control" name="title" placeholder="Title" required></div>
              <div class="col"><input type="text" class="form-control" name="description" placeholder="Description" required></div>
              <div class="col"><input type="url" class="form-control" name="link" placeholder="Project Link" required></div>
            </div>
          </div>
        </div>
        <button type="button" id="addProject" class="btn btn-sm btn-secondary mt-2">+ Add Project</button>
      </div>

      <!-- Social Links -->
      <div class="mb-3">
        <label class="form-label">Social Links <span class="text-danger">*</span></label>
        <input type="url" class="form-control mb-2" name="linkedin" placeholder="LinkedIn URL" required>
        <input type="url" class="form-control mb-2" name="github" placeholder="GitHub URL" required>
      </div>

      <!-- Submit -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Generate Portfolio</button>
      </div>
    </form>
  </div>

  <script>
    // Function to add Delete functionality
    function attachDeleteButton(entry) {
      const btn = entry.querySelector('.delete-btn');
      btn.classList.remove('d-none');
      btn.addEventListener('click', () => entry.remove());
    }

    // Add Education
    document.getElementById('addEducation').addEventListener('click', () => {
      const wrapper = document.getElementById('education-wrapper');
      const entry = document.createElement('div');
      entry.classList.add('entry-card', 'education-entry');
      entry.innerHTML = `
        <button type="button" class="btn btn-sm btn-danger delete-btn">Delete</button>
        <div class="row g-2">
          <div class="col"><input type="text" class="form-control" name="degree" placeholder="Degree" required></div>
          <div class="col"><input type="text" class="form-control" name="institution" placeholder="Institution" required></div>
          <div class="col"><input type="number" class="form-control" name="year" placeholder="Year" required></div>
        </div>
      `;
      wrapper.appendChild(entry);
      attachDeleteButton(entry);
    });

    // Add Project
    document.getElementById('addProject').addEventListener('click', () => {
      const wrapper = document.getElementById('projects-wrapper');
      const entry = document.createElement('div');
      entry.classList.add('entry-card', 'project-entry');
      entry.innerHTML = `
        <button type="button" class="btn btn-sm btn-danger delete-btn">Delete</button>
        <div class="row g-2">
          <div class="col"><input type="text" class="form-control" name="title" placeholder="Title" required></div>
          <div class="col"><input type="text" class="form-control" name="description" placeholder="Description" required></div>
          <div class="col"><input type="url" class="form-control" name="link" placeholder="Project Link" required></div>
        </div>
      `;
      wrapper.appendChild(entry);
      attachDeleteButton(entry);
    });

    // Handle form submit
    document.getElementById('portfolioForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const formData = new FormData(this);

      // Collect Education
      const education = [];
      document.querySelectorAll('.education-entry').forEach(entry => {
        education.push({
          degree: entry.querySelector('[name="degree"]').value,
          institution: entry.querySelector('[name="institution"]').value,
          year: entry.querySelector('[name="year"]').value
        });
      });

      // Collect Projects
      const projects = [];
      document.querySelectorAll('.project-entry').forEach(entry => {
        projects.push({
          title: entry.querySelector('[name="title"]').value,
          description: entry.querySelector('[name="description"]').value,
          link: entry.querySelector('[name="link"]').value
        });
      });

      // Collect Experience (optional)
      const experience = [];
      document.querySelectorAll('.experience-entry').forEach(entry => {
        const role = entry.querySelector('[name="role"]').value;
        const company = entry.querySelector('[name="company"]').value;
        const duration = entry.querySelector('[name="duration"]').value;
        const description = entry.querySelector('[name="description"]').value;
        if (role || company || duration || description) {
          experience.push({ role, company, duration, description });
        }
      });

      const portfolioData = {
        bio: formData.get('bio'),
        imageUrl: formData.get('imageUrl'),
        skills: formData.get('skills') ? formData.get('skills').split(',').map(s => s.trim()) : [],
        education,
        experience,
        projects,
        social: {
          linkedin: formData.get('linkedin'),
          github: formData.get('github')
        }
      };

      // Save to localStorage
      localStorage.setItem('portfolioData', JSON.stringify(portfolioData));
      // Redirect
      window.location.href = "portfolio.html";
    });
  </script>
</body>
</html>
